name: FX Rate Daily Refresh (央行中间价自动同步)

# 每日 09:30 北京时间(= 01:30 UTC)自动抓取当日人民币兑美元中间价，
# 写回 fx_rate.json 并推送到仓库。GitHub Pages 静态托管，无后端，
# 页面 price.html 每次打开即 fetch 同源 fx_rate.json(cache:no-store) 拿到最新中间价。
#
# 源：huilv.cc 按日期生成的中间价页面（境外服务器可直连，含「1美元对人民币X.XXXX元」）。
# 失败/周末/节假日：保留上一次成功值，绝不回退到市场汇率。
#
# 首次部署注意：fine-grained PAT 默认无 Workflows:write，用 API 推送本文件会 403。
#   两种解法任选其一：
#   (a) 在 GitHub 网页仓库中手动新建 .github/workflows/fx-refresh.yml 粘贴本内容；或
#   (b) 给该 PAT 增加 Workflows:write 权限后重跑部署脚本。
#   工作流建好后会用仓库自带的 GITHUB_TOKEN(contents:write) 自行提交 fx_rate.json，无需再管。

on:
  schedule:
    - cron: '30 1 * * *'        # 01:30 UTC = 09:30 Asia/Shanghai
  workflow_dispatch:           # 允许在 Actions 页手动触发一次验证

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch central parity & update fx_rate.json
        run: |
          python3 - <<'PY'
          import urllib.request, re, json, datetime, sys

          # 北京时间今日（中国无夏令时，UTC+8 即可）
          bj = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)
          ymd = bj.strftime("%Y%m%d")
          url = f"https://www.huilv.cc/rmbzjj/{ymd}.html"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              html = urllib.request.urlopen(req, timeout=25).read().decode("utf-8", "ignore")
          except Exception as e:
              print("fetch failed, keep last value:", e)
              sys.exit(0)

          m = re.search(r"1美元对人民币(\d+\.\d+)元", html)
          if not m:
              print("no central-parity found (weekend/holiday?), keep last value")
              sys.exit(0)

          rate = float(m.group(1))
          if not (6.0 <= rate <= 8.0):
              print("rate out of sane range, abort:", rate)
              sys.exit(0)

          data = {
              "date": bj.strftime("%Y-%m-%d"),
              "usdCny": rate,
              "src": "中国人民银行授权中国外汇交易中心公布 · 人民币汇率中间价（GitHub Action 自动同步 huilv.cc）"
          }
          with open("fx_rate.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("fx_rate.json updated ->", data["date"], rate)
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add fx_rate.json
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "chore: auto-sync fx_rate.json to $(date +%F) central parity"
            git push
          fi
